[workspace]
resolver = "2"
members = ["am"]

[workspace.dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
anyhow = "1"
rustyline = "=13.0.0"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
